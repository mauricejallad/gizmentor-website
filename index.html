<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f7f9" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="impact-site-verification" content="118daa5e-ac68-4d8a-a588-c246631ebb29" />
    <script>
      // Set the theme before first paint: the visitor's stored choice, else the system setting.
      (function () {
        var d = document.documentElement, s = null;
        d.classList.add('js');
        try { s = localStorage.getItem('theme'); } catch (e) {}
        var t = s === 'light' || s === 'dark' ? s : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        d.setAttribute('data-theme', t);
        if (t === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0b0d11');
      })();
    </script>
    <!--app-head-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
